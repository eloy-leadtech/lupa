# Reglas propias de Lupa para Semgrep: lo que los paquetes estándar no miran.
# Jenkins y scripts de despliegue, configuraciones que dejan cosas al aire y
# bases de datos expuestas. Todas son de categoría "security".
rules:
  # ------------------------------------------------------------ Jenkins y CI
  - id: lupa.jenkins.secreto-interpolado
    languages: [generic]
    severity: WARNING
    paths: { include: ["**/Jenkinsfile*", "**/*.jenkinsfile", "**/jenkins/**/*.groovy", "**/vars/*.groovy"] }
    pattern-regex: 'sh\s*\(?\s*"(?:[^"\\\n]|\\.)*\$\{?\s*(?:env\.)?[A-Z_]*(?:PASS|PASSWORD|PWD|TOKEN|SECRET|KEY|CRED)[A-Z_]*'
    message: "Jenkins mete una credencial en un comando con comillas dobles"
    metadata:
      category: security
      lupa-cat: infra
      lupa-severity: MEDIUM
      lupa-detail: "Con comillas dobles, Groovy sustituye el secreto antes de lanzar el comando, así que queda en la lista de procesos del agente y puede acabar en los logs. Jenkins avisa de esto como «insecure interpolation». Usa comillas simples y deja que lo expanda el shell ($PASSWORD)."

  - id: lupa.jenkins.echo-secreto
    languages: [generic]
    severity: ERROR
    paths: { include: ["**/Jenkinsfile*", "**/*.jenkinsfile", "**/*.groovy", "**/*.sh"] }
    pattern-regex: 'echo\s+["''][^\n]*\$\{?\s*(?:env\.)?[A-Z_]*(?:PASS|PASSWORD|TOKEN|SECRET|APIKEY|API_KEY)[A-Z_]*'
    message: "El pipeline imprime una credencial en el log"
    metadata:
      category: security
      lupa-cat: infra
      lupa-severity: HIGH
      lupa-detail: "Un echo con la variable del secreto lo deja escrito en el log de la build, que suele poder leer mucha más gente que la credencial."

  - id: lupa.ci.curl-a-shell
    languages: [generic]
    severity: WARNING
    paths: { include: ["**/Jenkinsfile*", "**/*.sh", "**/Dockerfile*", "**/*.yml", "**/*.yaml", "**/Makefile"] }
    pattern-regex: '(?:curl|wget)\b[^\n|]*\|\s*(?:sudo\s+)?(?:ba|z)?sh\b'
    message: "Se descarga un script de internet y se ejecuta sin comprobarlo"
    metadata:
      category: security
      lupa-cat: infra
      lupa-severity: MEDIUM
      lupa-detail: "Si alguien cambia ese script en origen (o en medio), se ejecuta su código con los permisos del servidor de build. Descárgalo, comprueba su hash o firma, y luego ejecútalo."

  - id: lupa.ci.tls-desactivado
    languages: [generic]
    severity: WARNING
    paths: { include: ["**/Jenkinsfile*", "**/*.sh", "**/Dockerfile*", "**/*.yml", "**/*.yaml", "**/*.groovy", "**/Makefile", "**/.npmrc", "**/.gitconfig"] }
    pattern-regex: '(?:curl\b[^\n]*\s(?:-k|--insecure)\b|NODE_TLS_REJECT_UNAUTHORIZED\s*[=:]\s*["'']?0|GIT_SSL_NO_VERIFY\s*[=:]\s*["'']?(?:1|true)|sslVerify\s*=?\s*false|--no-check-certificate|strict-ssl\s*=\s*false)'
    message: "Se desactiva la comprobación de certificados HTTPS"
    metadata:
      category: security
      lupa-cat: infra
      lupa-severity: MEDIUM
      lupa-detail: "Sin comprobar el certificado, cualquiera en medio de la red puede hacerse pasar por el servidor y colar paquetes o robar credenciales."

  - id: lupa.jenkins.agente-cualquiera
    languages: [generic]
    severity: INFO
    paths: { include: ["**/Jenkinsfile*", "**/*.jenkinsfile"] }
    pattern-regex: '\bagent\s+any\b'
    message: "El pipeline puede ejecutarse en cualquier agente de Jenkins"
    metadata:
      category: security
      lupa-cat: infra
      lupa-severity: LOW
      lupa-detail: "Con «agent any» la build puede caer en el propio controlador de Jenkins o en un agente con más permisos de los necesarios. Mejor fijar una etiqueta de agente dedicado."

  - id: lupa.docker.privilegiado
    languages: [generic]
    severity: WARNING
    paths: { include: ["**/Jenkinsfile*", "**/*.sh", "**/*.yml", "**/*.yaml"] }
    pattern-regex: '(?:docker\s+run\b[^\n]*--privileged|privileged:\s*true|/var/run/docker\.sock)'
    message: "Un contenedor corre en modo privilegiado o con acceso al Docker del servidor"
    metadata:
      category: security
      lupa-cat: infra
      lupa-severity: HIGH
      lupa-detail: "Un contenedor privilegiado, o con el socket de Docker montado, puede tomar el control de la máquina que lo ejecuta. Si se le cuela código malicioso, el servidor entero queda comprometido."

  # ------------------------------------------------------------ apps con IA (OWASP Top 10 para LLM)
  - id: lupa.ia.clave-en-el-navegador
    languages: [generic]
    severity: ERROR
    paths: { include: ["**/*.js", "**/*.jsx", "**/*.ts", "**/*.tsx", "**/*.vue", "**/*.svelte", "**/.env", "**/.env.*"] }
    pattern-regex: '\b(?:NEXT_PUBLIC|VITE|REACT_APP|EXPO_PUBLIC|NUXT_PUBLIC|PUBLIC|GATSBY)_[A-Z0-9_]*(?:OPENAI|ANTHROPIC|CLAUDE|GEMINI|GOOGLE_AI|MISTRAL|GROQ|COHERE|LLM|AZURE_OPENAI|HUGGINGFACE|HF|PINECONE|AI)[A-Z0-9_]*(?:KEY|TOKEN|SECRET)\b'
    message: "La clave del proveedor de IA va al navegador"
    metadata:
      category: security
      lupa-cat: ia
      lupa-severity: HIGH
      lupa-detail: "Las variables con prefijo NEXT_PUBLIC_, VITE_, REACT_APP_… se meten en el JavaScript que descarga cualquier visitante. Con esa clave, cualquiera usa vuestra cuenta de IA a vuestra costa y puede leer o borrar lo que tengáis allí. Las llamadas al modelo tienen que pasar por el servidor."

  - id: lupa.ia.sdk-en-el-navegador
    languages: [generic]
    severity: ERROR
    paths: { include: ["**/*.js", "**/*.jsx", "**/*.ts", "**/*.tsx", "**/*.vue", "**/*.svelte"] }
    pattern-regex: '\bdangerouslyAllowBrowser\s*:\s*true'
    message: "El SDK de IA se usa directamente desde el navegador"
    metadata:
      category: security
      lupa-cat: ia
      lupa-severity: HIGH
      lupa-detail: "dangerouslyAllowBrowser: true hace que la clave del proveedor de IA viaje al navegador del usuario. Cualquiera puede copiarla de las herramientas de desarrollador."

  - id: lupa.ia.respuesta-sin-limpiar
    languages: [generic]
    severity: WARNING
    paths: { include: ["**/*.jsx", "**/*.tsx", "**/*.js", "**/*.ts", "**/*.vue", "**/*.svelte", "**/*.html"] }
    pattern-regex: '(?:dangerouslySetInnerHTML=\{\{\s*__html:\s*[^}]*(?:message|response|completion|answer|content|output|reply|chunk|markdown|stream)|v-html="[^"]*(?:message|response|answer|content|reply|output)|\{@html\s+[^}]*(?:message|response|answer|content|reply)|\.innerHTML\s*[+]?=\s*[^;\n]*(?:response|completion|answer|message|reply|chunk))'
    message: "La respuesta del modelo se pinta como HTML sin limpiar"
    metadata:
      category: security
      lupa-cat: ia
      lupa-severity: HIGH
      lupa-detail: "Si el modelo devuelve HTML o JavaScript (porque alguien se lo ha pedido con un mensaje trampa o porque viene de un documento que ha leído), se ejecuta en el navegador del usuario: robo de sesión, phishing dentro del propio chat. Hay que pasar la respuesta por un sanitizador (DOMPurify) o pintarla como texto. Es el LLM05 de OWASP."

  - id: lupa.ia.entrada-en-el-prompt-de-sistema
    languages: [generic]
    severity: WARNING
    paths: { include: ["**/*.js", "**/*.ts", "**/*.mjs", "**/*.py", "**/*.php", "**/*.java", "**/*.go"] }
    pattern-regex: '(?:role["'']?\s*[:=]\s*["'']system["''][^}\n]{0,80}content["'']?\s*[:=]\s*(?:`[^`]*\$\{[^}]*(?:req\.|request|body|input|query|params|user|message)|f["''][^"'']*\{[^}]*(?:request|body|input|query|user|message))|system(?:_prompt|Prompt)?\s*[:=]\s*(?:`[^`]*\$\{[^}]*(?:req\.|request|body|input|query|params)|f["''][^"'']*\{[^}]*(?:request\.|body|input|query)))'
    message: "Lo que escribe el usuario entra en las instrucciones de sistema del modelo"
    metadata:
      category: security
      lupa-cat: ia
      lupa-severity: MEDIUM
      lupa-detail: "Mezclar texto del usuario con las instrucciones de sistema le da al usuario el mando del modelo (inyección de prompt): puede saltarse las reglas, sacar el prompt interno o hacer que use herramientas que no debería. El texto del usuario va en su propio mensaje, nunca dentro del de sistema. Es el LLM01 de OWASP."

  - id: lupa.ia.herramientas-peligrosas
    languages: [generic]
    severity: ERROR
    paths: { include: ["**/*.py", "**/*.js", "**/*.ts", "**/*.mjs"] }
    pattern-regex: '\b(?:ShellTool|PythonREPLTool|PythonAstREPLTool|create_python_agent|create_pandas_dataframe_agent|create_sql_agent|BashProcess|allow_dangerous_code\s*=\s*True|allow_dangerous_requests\s*=\s*True|allowDangerousRequests\s*:\s*true|load_tools\(\s*\[[^\]]*(?:terminal|python_repl|requests_all|shell))'
    message: "El agente de IA puede ejecutar código, comandos o consultas por su cuenta"
    metadata:
      category: security
      lupa-cat: ia
      lupa-severity: HIGH
      lupa-detail: "Si el modelo tiene una herramienta de shell, Python, SQL libre o peticiones HTTP sin límites, un mensaje trampa (del usuario o de un documento que lee) puede acabar ejecutando comandos en el servidor o leyendo la base de datos entera. Hay que darle solo herramientas acotadas y pedir confirmación para lo peligroso. Es el LLM06 de OWASP."

  - id: lupa.ia.codigo-remoto-del-modelo
    languages: [generic]
    severity: ERROR
    paths: { include: ["**/*.py"] }
    pattern-regex: '(?:trust_remote_code\s*=\s*True|torch\.load\((?![^)]*weights_only\s*=\s*True)[^)]*\))'
    message: "Cargar el modelo ejecuta código que viene con él"
    metadata:
      category: security
      lupa-cat: ia
      lupa-severity: HIGH
      lupa-detail: "trust_remote_code=True y torch.load sin weights_only=True ejecutan código Python incluido en el modelo descargado. Un modelo manipulado toma el control del servidor. Es la cadena de suministro de IA (LLM03 de OWASP)."

  # ------------------------------------------------------------ web y base de datos
  - id: lupa.web.cookie-insegura
    languages: [generic]
    severity: WARNING
    paths: { include: ["**/*.js", "**/*.ts", "**/*.py", "**/*.php", "**/.env", "**/*.yml", "**/*.properties"] }
    pattern-regex: '(?i)(?:\bhttpOnly\s*:\s*false|\bsecure\s*:\s*false|SESSION_COOKIE_(?:SECURE|HTTPONLY)\s*=\s*False|CSRF_COOKIE_SECURE\s*=\s*False|SESSION_SECURE_COOKIE\s*=\s*false|["'']?(?:secure|httponly)["'']?\s*=>\s*false|server\.servlet\.session\.cookie\.(?:secure|http-only)\s*=\s*false)'
    message: "La cookie de sesión se puede robar más fácil (sin Secure o sin HttpOnly)"
    metadata:
      category: security
      lupa-cat: exposicion
      lupa-severity: MEDIUM
      lupa-detail: "Sin HttpOnly, cualquier script inyectado en la página lee la cookie de sesión. Sin Secure, viaja también por HTTP sin cifrar. En los dos casos alguien puede quedarse con la sesión del usuario."

  - id: lupa.web.hash-debil-de-contrasenas
    languages: [generic]
    severity: ERROR
    paths: { include: ["**/*.js", "**/*.ts", "**/*.py", "**/*.php", "**/*.java", "**/*.go", "**/*.rb"] }
    pattern-regex: '(?i)(?:\b(?:md5|sha1)\s*\(\s*\$?[\w.\[\]''"]*(?:password|passwd|pass|pwd|clave|contrasena)|createHash\(\s*["''](?:md5|sha1|sha256)["'']\s*\)[^;\n]*(?:password|passwd|pass|pwd)|hashlib\.(?:md5|sha1|sha256)\([^)]*(?:password|passwd|pwd)|MessageDigest\.getInstance\(\s*"(?:MD5|SHA-1|SHA1)"\s*\))'
    message: "Las contraseñas se guardan con un hash rápido (MD5/SHA), que se rompe en minutos"
    metadata:
      category: security
      lupa-cat: codigo
      lupa-severity: HIGH
      lupa-detail: "MD5 o SHA sin sal ni coste se revientan a millones por segundo: si se filtra la base de datos, salen casi todas las contraseñas en claro. Hay que usar bcrypt, scrypt o Argon2."

  - id: lupa.web.jwt-sin-verificar
    languages: [generic]
    severity: ERROR
    paths: { include: ["**/*.js", "**/*.ts", "**/*.py", "**/*.php", "**/*.java", "**/*.go"] }
    pattern-regex: '(?:algorithms?\s*[:=]\s*\[?\s*["'']none["'']|verify_signature["'']?\s*:\s*False|jwt\.decode\([^)]*verify\s*=\s*False|ignoreExpiration\s*:\s*true|\.parseUnsecuredClaims\(|jwt\.decode\(\s*[^,)]+\s*\)\s*(?:;|$))'
    message: "Los tokens de sesión (JWT) se aceptan sin comprobar la firma o la caducidad"
    metadata:
      category: security
      lupa-cat: codigo
      lupa-severity: HIGH
      lupa-detail: "Sin verificar la firma, cualquiera fabrica un token con el usuario y el rol que quiera (también administrador). Sin comprobar la caducidad, un token robado vale para siempre."

  - id: lupa.web.tls-desactivado
    languages: [generic]
    severity: WARNING
    paths: { include: ["**/*.js", "**/*.ts", "**/*.py", "**/*.php", "**/*.java", "**/*.go", "**/.env", "**/.env.*", "**/*.yml", "**/*.yaml", "**/*.properties", "**/*.json"] }
    pattern-regex: '(?:sslmode=disable|rejectUnauthorized\s*:\s*false|useSSL=false|verify_ssl\s*=\s*False|CURLOPT_SSL_VERIFYPEER\s*,\s*(?:false|0)\b|requests\.\w+\([^)\n]*verify\s*=\s*False|InsecureSkipVerify\s*:\s*true|ssl_verify\s*[:=]\s*(?:false|False|0)\b)'
    message: "Una conexión (a la base de datos u otro servicio) no comprueba el certificado"
    metadata:
      category: security
      lupa-cat: exposicion
      lupa-severity: MEDIUM
      lupa-detail: "Sin comprobar el certificado, cualquiera en medio de la red (otra máquina del mismo proveedor, una wifi) puede hacerse pasar por la base de datos o el servicio y leer las credenciales y los datos que pasan."

  - id: lupa.web.url-firmada-larga
    languages: [generic]
    severity: WARNING
    paths: { include: ["**/*.js", "**/*.ts", "**/*.py", "**/*.php", "**/*.java", "**/*.go"] }
    pattern-regex: '(?:\bexpiresIn\s*:\s*(?:[1-9]\d{4,}|\d+\s*\*\s*\d+\s*\*\s*(?:24|60))|ExpiresIn\s*=\s*[1-9]\d{4,}|expires_?in\s*=\s*[1-9]\d{4,}|Expires\s*:\s*[1-9]\d{4,}|ExpiresIn\s*:\s*[1-9]\d{4,})'
    message: "Los enlaces firmados a ficheros duran horas o días"
    metadata:
      category: security
      lupa-cat: datos
      lupa-severity: MEDIUM
      lupa-detail: "Un enlace firmado (S3, Azure, GCS) a un documento sirve a cualquiera que lo tenga mientras no caduque. Si dura días y se reenvía, se queda en un log o en el historial, el pasaporte o el documento queda al alcance de cualquiera. Para documentos personales, minutos."

  - id: lupa.web.logs-con-datos-personales
    languages: [generic]
    severity: WARNING
    paths: { include: ["**/*.js", "**/*.ts", "**/*.py", "**/*.php", "**/*.java", "**/*.go"] }
    pattern-regex: '(?i)(?:console\.(?:log|info|debug)|logger\.\w+|log\.\w+|logging\.\w+|print|error_log|Log\.\w+)\s*\([^)\n]*(?:req\.body|request\.(?:data|POST|json|body)|\$_POST|password|passwd|passport|pasaporte|\bdni\b|\bssn\b|card_?number|\biban\b|date_?of_?birth)'
    message: "Los logs guardan datos personales o contraseñas"
    metadata:
      category: security
      lupa-cat: datos
      lupa-severity: MEDIUM
      lupa-detail: "Lo que va al log acaba en sistemas que lee mucha más gente (monitorización, soporte, proveedores) y que se guardan mucho tiempo. Pasaportes, DNI, contraseñas o cuerpos enteros de peticiones no deben ir nunca a un log."

  - id: lupa.secretos.cadena-de-conexion
    languages: [generic]
    severity: ERROR
    paths: { include: ["**/*.js", "**/*.ts", "**/*.py", "**/*.php", "**/*.java", "**/*.go", "**/*.yml", "**/*.yaml", "**/*.properties", "**/*.json", "**/.env", "**/.env.*", "**/*.tf"], exclude: ["**/.env.example", "**/.env.sample", "**/*.dist"] }
    pattern-regex: '\b(?:postgres(?:ql)?|mysql|mariadb|mongodb(?:\+srv)?|redis|rediss|amqps?|mssql|sqlserver)://(?!(?:user|username|usuario|root|admin|postgres)?:(?:password|pass|secret|changeme|xxx+|\*+|<[^>]*>)@)[^:\s''"/@]+:[^@\s''"$<{]{4,}@'
    message: "Hay una cadena de conexión a una base de datos con la contraseña dentro"
    metadata:
      category: security
      lupa-cat: secretos
      lupa-severity: HIGH
      lupa-detail: "Con esa cadena, cualquiera con acceso al repo entra directamente en la base de datos. Hay que sacarla a una variable de entorno o a un gestor de secretos, y cambiar la contraseña."

  # ------------------------------------------------------------ claves de la propia aplicación
  - id: lupa.secretos.clave-de-la-app
    languages: [generic]
    severity: ERROR
    paths: { include: ["**/*.py", "**/*.js", "**/*.ts", "**/*.php", "**/*.rb", "**/*.yml", "**/*.yaml", "**/*.properties", "**/.env", "**/.env.*"], exclude: ["**/.env.example", "**/.env.sample", "**/*.dist"] }
    pattern-regex: '(?im)^\s*(?:SECRET_KEY|app\.secret_key|APP_KEY|JWT_SECRET|SESSION_SECRET|COOKIE_SECRET|secret_key_base|jwt\.secret|session\.secret)\s*[=:]\s*["'']?(?!(?:change|your|example|xxx|dummy|test|secret|<|\$\{|%\(|env\(|os\.environ|getenv|process\.env))[A-Za-z0-9+/=_\-!@#$%^&*()]{12,}'
    message: "La clave secreta de la aplicación está escrita en el código"
    metadata:
      category: security
      lupa-cat: secretos
      lupa-severity: HIGH
      lupa-detail: "Con esta clave se firman las sesiones, las cookies o los tokens. Quien la tenga puede fabricar una sesión de cualquier usuario, incluido el administrador, sin saber su contraseña. Hay que sacarla a una variable de entorno y cambiarla."

  # ------------------------------------------------------------ configuraciones que exponen
  - id: lupa.exposicion.laravel-debug
    languages: [generic]
    severity: ERROR
    paths: { include: ["**/.env", "**/.env.prod*", "**/.env.production"] }
    pattern-regex: '(?m)^\s*APP_DEBUG\s*=\s*true\b'
    message: "Laravel tiene el modo depuración activado"
    metadata:
      category: security
      lupa-cat: exposicion
      lupa-severity: HIGH
      lupa-detail: "Con APP_DEBUG=true, cualquier error enseña al visitante el código, las variables de entorno y a veces las contraseñas de la base de datos."

  - id: lupa.exposicion.django-debug
    languages: [generic]
    severity: WARNING
    paths: { include: ["**/settings.py", "**/settings_*.py", "**/settings/*.py", "**/prod*.py"] }
    pattern-regex: '(?m)^\s*DEBUG\s*=\s*True\b'
    message: "Django tiene el modo depuración activado"
    metadata:
      category: security
      lupa-cat: exposicion
      lupa-severity: MEDIUM
      lupa-detail: "Con DEBUG=True, las páginas de error enseñan el código, la configuración y las rutas internas. Solo vale en el ordenador del desarrollador."

  - id: lupa.exposicion.php-errores
    languages: [generic]
    severity: WARNING
    paths: { include: ["**/*.php", "**/*.ini", "**/.htaccess"] }
    pattern-regex: '(?im)(?:ini_set\(\s*["'']display_errors["'']\s*,\s*["'']?(?:1|on|true)|^\s*display_errors\s*=\s*On\b|php_flag\s+display_errors\s+on)'
    message: "PHP enseña los errores al visitante"
    metadata:
      category: security
      lupa-cat: exposicion
      lupa-severity: MEDIUM
      lupa-detail: "Los mensajes de error de PHP revelan rutas del servidor, consultas SQL y versiones, que es justo lo que necesita un atacante para afinar."

  - id: lupa.exposicion.phpinfo
    languages: [generic]
    severity: WARNING
    paths: { include: ["**/*.php"] }
    pattern-regex: '(?<![''"\w>])phpinfo\s*\(\s*\)\s*;'
    message: "Hay una página que enseña toda la configuración del servidor (phpinfo)"
    metadata:
      category: security
      lupa-cat: exposicion
      lupa-severity: HIGH
      lupa-detail: "phpinfo() publica versiones, módulos, rutas y variables de entorno del servidor, a veces con credenciales. No debe existir en un servidor accesible."

  - id: lupa.exposicion.actuator-abierto
    languages: [generic]
    severity: WARNING
    paths: { include: ["**/*.properties", "**/application*.yml", "**/application*.yaml", "**/bootstrap*.yml"] }
    pattern-regex: '(?:management\.endpoints\.web\.exposure\.include\s*[=:]\s*["'']?\*|exposure:\s*\r?\n\s*include:\s*["'']?\*)'
    message: "Spring publica todos los endpoints internos de Actuator"
    metadata:
      category: security
      lupa-cat: exposicion
      lupa-severity: HIGH
      lupa-detail: "Con include=* quedan abiertos /actuator/env, /heapdump y compañía, que sueltan variables de entorno, credenciales y la memoria entera de la aplicación."

  - id: lupa.exposicion.cors-abierto
    languages: [generic]
    severity: WARNING
    paths: { include: ["**/*.js", "**/*.ts", "**/*.mjs", "**/*.py", "**/*.php", "**/*.java", "**/*.go", "**/*.conf", "**/*.yml", "**/*.yaml"] }
    pattern-regex: '(?:Access-Control-Allow-Origin["'']?\s*[:,]\s*["'']\*["'']|(?:app|router|server)\.(?:use|options)\([^)\n]*\bcors\(\s*\)|cors\(\s*\{\s*origin\s*:\s*(?:["'']\*["'']|true)|CORS_(?:ORIGIN_)?ALLOW_ALL(?:_ORIGINS)?\s*=\s*True|allowedOrigins\(\s*"\*"\s*\)|header\(\s*["'']Access-Control-Allow-Origin:\s*\*|add_header\s+Access-Control-Allow-Origin\s+["'']?\*)'
    message: "La API acepta peticiones de cualquier web (CORS abierto)"
    metadata:
      category: security
      lupa-cat: exposicion
      lupa-severity: MEDIUM
      lupa-detail: "Con CORS abierto, cualquier web que visite un usuario puede llamar a esta API desde su navegador. Si además se aceptan cookies o tokens, una web maliciosa puede leer sus datos."

  - id: lupa.exposicion.graphql-abierto
    languages: [generic]
    severity: INFO
    paths: { include: ["**/*.js", "**/*.ts", "**/*.py", "**/*.java", "**/*.go", "**/*.yml"] }
    pattern-regex: '\b(?:introspection|playground|graphiql)\s*[:=]\s*(?:true|True)\b'
    message: "GraphQL deja ver todo el esquema o abre su consola"
    metadata:
      category: security
      lupa-cat: exposicion
      lupa-severity: MEDIUM
      lupa-detail: "La introspección o la consola de GraphQL en producción le dan al atacante el mapa completo de la API: todos los tipos, campos y operaciones, incluidas las internas."

  - id: lupa.exposicion.docs-api-publicas
    languages: [generic]
    severity: INFO
    paths: { include: ["**/*.js", "**/*.ts", "**/*.py", "**/*.php"] }
    pattern-regex: '(?:app\.use\(\s*["''][^"'']*(?:api-docs|swagger)[^"'']*["'']\s*,\s*swaggerUi|SwaggerModule\.setup\(|get_swagger_view|SpectacularSwaggerView)'
    message: "La documentación de la API se publica junto a la API"
    metadata:
      category: security
      lupa-cat: exposicion
      lupa-severity: LOW
      lupa-detail: "Útil en desarrollo, pero en producción enseña cada endpoint y sus parámetros. Confirma que no se activa en el entorno público, o protégela con login."

  - id: lupa.exposicion.listado-directorios
    languages: [generic]
    severity: WARNING
    paths: { include: ["**/*.js", "**/*.ts", "**/*.conf", "**/.htaccess", "**/*.py", "**/nginx*"] }
    pattern-regex: '(?:serveIndex\(|\bautoindex\s+on\b|Options\s+[^\n]*\+?Indexes\b)'
    message: "El servidor enseña el listado de ficheros de una carpeta"
    metadata:
      category: security
      lupa-cat: exposicion
      lupa-severity: MEDIUM
      lupa-detail: "Con el listado de carpetas activo, cualquiera puede navegar y descargar lo que haya: copias de seguridad, logs, ficheros de configuración."

  - id: lupa.exposicion.bd-puerto-publico
    languages: [generic]
    severity: WARNING
    paths: { include: ["**/docker-compose*.yml", "**/docker-compose*.yaml", "**/compose*.yml", "**/compose*.yaml"] }
    pattern-regex: '(?m)^(\s*)ports:\s*\r?\n(?:\1\s+-[^\n]*\r?\n)*?\1\s+-\s*["'']?(?:0\.0\.0\.0:)?(?:3306|5432|6379|27017|9200|5984|11211|1433|1521|9042|2379|8086|5672|15672)(?::\d+)?["'']?\s*$'
    message: "Una base de datos o cola se publica en todas las interfaces de red"
    metadata:
      category: security
      lupa-cat: infra
      lupa-severity: MEDIUM
      lupa-detail: "Publicar el puerto así lo abre a toda la red (y a internet si la máquina tiene IP pública). Docker se salta el firewall del sistema. Si solo lo usa esta máquina, publícalo en 127.0.0.1."
