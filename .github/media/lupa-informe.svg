<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760" role="img" aria-label="Ilustración del informe de Lupa con datos ficticios: nota, contadores, lo urgente, el camino a producción y dónde se pierde la seguridad">
  <style>
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, 'Cascadia Code', SFMono-Regular, Menlo, Consolas, monospace; }
  </style>
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070C1A"/>
      <stop offset="0.6" stop-color="#11122F"/>
      <stop offset="1" stop-color="#1E1B52"/>
    </linearGradient>
    <pattern id="puntos" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1.3" fill="#94A3B8" fill-opacity="0.13"/>
    </pattern>
    <radialGradient id="resplandor" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#818CF8" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tarjeta"><rect width="1280" height="760" rx="28"/></clipPath>
    <clipPath id="ventana"><rect x="64" y="48" width="1152" height="664" rx="16"/></clipPath>
    <filter id="sombra" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <g clip-path="url(#tarjeta)">
    <rect width="1280" height="760" fill="url(#fondo)"/>
    <rect width="1280" height="760" fill="url(#puntos)"/>
    <circle cx="640" cy="380" r="520" fill="url(#resplandor)"/>

    <rect x="64" y="48" width="1152" height="664" rx="16" fill="#FFFFFF" filter="url(#sombra)"/>
    <g clip-path="url(#ventana)" class="sans">
      <!-- barra del navegador -->
      <rect x="64" y="48" width="1152" height="44" fill="#F1F5F9"/>
      <circle cx="92" cy="70" r="6" fill="#F87171"/><circle cx="114" cy="70" r="6" fill="#FBBF24"/><circle cx="136" cy="70" r="6" fill="#34D399"/>
      <rect x="380" y="58" width="520" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="640" y="75" class="mono" font-size="13" fill="#475569" text-anchor="middle">lupa-demo-tienda-2026-10-29.html</text>

      <!-- pestañas -->
      <text x="96" y="120" font-size="15" font-weight="700" fill="#1E1B4B">Informe</text>
      <rect x="88" y="132" width="76" height="3" rx="1.5" fill="#4F46E5"/>
      <text x="192" y="120" font-size="15" fill="#64748B">Mapa del código</text>
      <rect x="1040" y="104" width="152" height="24" rx="12" fill="#DCFCE7"/>
      <text x="1116" y="121" font-size="13" font-weight="700" fill="#15803D" text-anchor="middle">✓ Pasada completa</text>
      <line x1="64" y1="136" x2="1216" y2="136" stroke="#E2E8F0"/>

      <!-- cabecera -->
      <circle cx="148" cy="214" r="50" fill="#F59E0B"/>
      <text x="148" y="235" font-size="58" font-weight="800" fill="#FFFFFF" text-anchor="middle">C</text>
      <text x="224" y="200" font-size="30" font-weight="700" fill="#0F172A">tienda-demo</text>
      <text x="224" y="226" font-size="14" fill="#64748B">Equipo Demo · commit 4f2c9e1 · 29 oct 2026 · gitleaks 8.30 · Semgrep 1.179 · Trivy 0.75 · zizmor 1.31</text>
      <rect x="224" y="244" width="88" height="28" rx="14" fill="#FEE2E2"/>
      <text x="268" y="263" font-size="13" font-weight="700" fill="#B91C1C" text-anchor="middle">3 graves</text>
      <rect x="320" y="244" width="100" height="28" rx="14" fill="#FEF3C7"/>
      <text x="370" y="263" font-size="13" font-weight="700" fill="#B45309" text-anchor="middle">11 a mirar</text>
      <rect x="428" y="244" width="108" height="28" rx="14" fill="#DBEAFE"/>
      <text x="482" y="263" font-size="13" font-weight="700" fill="#1D4ED8" text-anchor="middle">24 menores</text>
      <rect x="544" y="244" width="204" height="28" rx="14" fill="#F1F5F9"/>
      <text x="646" y="263" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">6 falsos positivos descartados</text>
      <line x1="88" y1="300" x2="1192" y2="300" stroke="#E2E8F0"/>

      <!-- lo urgente -->
      <text x="96" y="332" font-size="12" font-weight="700" letter-spacing="1.5" fill="#334155">LO URGENTE</text>

      <g transform="translate(88 346)">
        <rect width="664" height="60" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
        <rect width="5" height="60" rx="2.5" fill="#EF4444"/>
        <rect x="20" y="12" width="70" height="20" rx="10" fill="#FEE2E2"/>
        <text x="55" y="26" font-size="11" font-weight="800" fill="#B91C1C" text-anchor="middle">GRAVE</text>
        <text x="106" y="27" font-size="15" font-weight="700" fill="#0F172A">Clave de AWS en el historial de git</text>
        <text x="106" y="47" class="mono" font-size="12.5" fill="#64748B">deploy/release.sh · commit a91f03b, de hace 8 meses</text>
        <text x="648" y="27" font-size="12" fill="#94A3B8" text-anchor="end">Secretos</text>
      </g>
      <g transform="translate(88 416)">
        <rect width="664" height="60" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
        <rect width="5" height="60" rx="2.5" fill="#EF4444"/>
        <rect x="20" y="12" width="70" height="20" rx="10" fill="#FEE2E2"/>
        <text x="55" y="26" font-size="11" font-weight="800" fill="#B91C1C" text-anchor="middle">GRAVE</text>
        <text x="106" y="27" font-size="15" font-weight="700" fill="#0F172A">Exportación de clientes sin autenticación</text>
        <text x="106" y="47" class="mono" font-size="12.5" fill="#64748B">POST /api/admin/export · revisado por Claude</text>
        <text x="648" y="27" font-size="12" fill="#94A3B8" text-anchor="end">Endpoints</text>
      </g>
      <g transform="translate(88 486)">
        <rect width="664" height="60" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
        <rect width="5" height="60" rx="2.5" fill="#EF4444"/>
        <rect x="20" y="12" width="70" height="20" rx="10" fill="#FEE2E2"/>
        <text x="55" y="26" font-size="11" font-weight="800" fill="#B91C1C" text-anchor="middle">GRAVE</text>
        <text x="106" y="27" font-size="15" font-weight="700" fill="#0F172A">Librería con un CVE que se está explotando</text>
        <text x="106" y="47" class="mono" font-size="12.5" fill="#64748B">package-lock.json · catálogo KEV · la app da a internet</text>
        <text x="648" y="27" font-size="12" fill="#94A3B8" text-anchor="end">Librerías</text>
      </g>
      <g transform="translate(88 556)">
        <rect width="664" height="60" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
        <rect width="5" height="60" rx="2.5" fill="#F59E0B"/>
        <rect x="20" y="12" width="70" height="20" rx="10" fill="#FEF3C7"/>
        <text x="55" y="26" font-size="11" font-weight="800" fill="#B45309" text-anchor="middle">A MIRAR</text>
        <text x="106" y="27" font-size="15" font-weight="700" fill="#0F172A">Producción despliega sin aprobación</text>
        <text x="106" y="47" class="mono" font-size="12.5" fill="#64748B">entorno production · GitHub Actions</text>
        <text x="648" y="27" font-size="12" fill="#94A3B8" text-anchor="end">CI/CD</text>
      </g>
      <g transform="translate(88 626)">
        <rect width="664" height="60" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
        <rect width="5" height="60" rx="2.5" fill="#F59E0B"/>
        <rect x="20" y="12" width="70" height="20" rx="10" fill="#FEF3C7"/>
        <text x="55" y="26" font-size="11" font-weight="800" fill="#B45309" text-anchor="middle">A MIRAR</text>
        <text x="106" y="27" font-size="15" font-weight="700" fill="#0F172A">PostgreSQL escuchando en todas las interfaces</text>
        <text x="106" y="47" class="mono" font-size="12.5" fill="#64748B">db-01 · 0.0.0.0:5432</text>
        <text x="648" y="27" font-size="12" fill="#94A3B8" text-anchor="end">Servidores</text>
      </g>

      <!-- camino a producción -->
      <text x="792" y="332" font-size="12" font-weight="700" letter-spacing="1.5" fill="#334155">CAMINO A PRODUCCIÓN</text>
      <line x1="812" y1="374" x2="1164" y2="374" stroke="#CBD5E1" stroke-width="3"/>
      <circle cx="812" cy="374" r="14" fill="#F59E0B"/>
      <circle cx="900" cy="374" r="14" fill="#EF4444"/>
      <circle cx="988" cy="374" r="14" fill="#22C55E"/>
      <circle cx="1076" cy="374" r="14" fill="#22C55E"/>
      <circle cx="1164" cy="374" r="14" fill="#F59E0B"/>
      <g font-size="12" fill="#475569" text-anchor="middle">
        <text x="812" y="410">código</text><text x="900" y="410">pipeline</text><text x="988" y="410">credenciales</text>
        <text x="1076" y="410">artefactos</text><text x="1164" y="410">destino</text>
      </g>

      <!-- dónde se pierde la seguridad -->
      <text x="792" y="456" font-size="12" font-weight="700" letter-spacing="1.5" fill="#334155">DÓNDE SE PIERDE LA SEGURIDAD</text>
      <g class="mono" font-size="13" font-weight="700">
        <rect x="792" y="470" width="220" height="130" rx="6" fill="#F87171"/>
        <text x="806" y="494" fill="#FFFFFF">api/</text>
        <text x="806" y="512" class="sans" font-size="12" font-weight="600" fill="#FFFFFF" fill-opacity="0.9">2 graves</text>
        <rect x="1016" y="470" width="168" height="80" rx="6" fill="#FCA5A5"/>
        <text x="1030" y="494" fill="#7F1D1D">infra/</text>
        <text x="1030" y="512" class="sans" font-size="12" font-weight="600" fill="#7F1D1D">1 grave</text>
        <rect x="1016" y="554" width="168" height="46" rx="6" fill="#FCD34D"/>
        <text x="1030" y="582" fill="#78350F">web/</text>
        <rect x="792" y="604" width="150" height="82" rx="6" fill="#FDE68A"/>
        <text x="806" y="628" fill="#78350F">jobs/</text>
        <rect x="946" y="604" width="118" height="82" rx="6" fill="#93C5FD"/>
        <text x="960" y="628" fill="#1E3A8A">lib/</text>
        <rect x="1068" y="604" width="116" height="82" rx="6" fill="#BBF7D0"/>
        <text x="1082" y="628" fill="#14532D">docs/</text>
      </g>
    </g>
  </g>
</svg>
