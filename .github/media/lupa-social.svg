<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Lupa: la auditoría de seguridad de un proyecto entero">
  <style>
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, 'Cascadia Code', SFMono-Regular, Menlo, Consolas, monospace; }
  </style>
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070C1A"/>
      <stop offset="0.55" stop-color="#121236"/>
      <stop offset="1" stop-color="#231F63"/>
    </linearGradient>
    <radialGradient id="resplandor" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="resplandor2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#818CF8" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="puntos" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1.4" fill="#94A3B8" fill-opacity="0.16"/>
    </pattern>
    <linearGradient id="titulo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C7D2FE"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1020"/>
      <stop offset="1" stop-color="#2B2876"/>
    </linearGradient>
    <linearGradient id="aro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <radialGradient id="cristal" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#67E8F9" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#67E8F9" stop-opacity="0.03"/>
    </radialGradient>
    <clipPath id="lente"><circle cx="112" cy="112" r="53"/></clipPath>
  </defs>

  <rect width="1280" height="640" fill="url(#fondo)"/>
  <rect width="1280" height="640" fill="url(#puntos)"/>
  <circle cx="248" cy="320" r="290" fill="url(#resplandor)"/>
  <circle cx="1110" cy="150" r="300" fill="url(#resplandor2)"/>

  <g transform="translate(0 50)">
    <g stroke="#A5B4FC" stroke-opacity="0.22" stroke-width="1.5">
      <line x1="930" y1="70" x2="1010" y2="120"/><line x1="1010" y1="120" x2="1100" y2="80"/>
      <line x1="1100" y1="80" x2="1190" y2="130"/><line x1="1010" y1="120" x2="1060" y2="190"/>
      <line x1="1060" y1="190" x2="1160" y2="200"/><line x1="1190" y1="130" x2="1160" y2="200"/>
      <line x1="1100" y1="80" x2="1160" y2="40"/><line x1="930" y1="70" x2="980" y2="30"/>
      <line x1="1160" y1="200" x2="1230" y2="230"/>
    </g>
    <circle cx="930" cy="70" r="5" fill="#CBD5E1" fill-opacity="0.5"/>
    <circle cx="980" cy="30" r="4" fill="#60A5FA" fill-opacity="0.7"/>
    <circle cx="1010" cy="120" r="6" fill="#CBD5E1" fill-opacity="0.5"/>
    <circle cx="1100" cy="80" r="6" fill="#FBBF24" fill-opacity="0.8"/>
    <circle cx="1160" cy="40" r="4" fill="#CBD5E1" fill-opacity="0.45"/>
    <circle cx="1190" cy="130" r="5" fill="#60A5FA" fill-opacity="0.7"/>
    <circle cx="1060" cy="190" r="5" fill="#CBD5E1" fill-opacity="0.45"/>
    <circle cx="1230" cy="230" r="4" fill="#CBD5E1" fill-opacity="0.4"/>
    <circle cx="1160" cy="200" r="16" fill="#F43F5E" fill-opacity="0.3"/>
    <circle cx="1160" cy="200" r="7" fill="#F43F5E"/>
  </g>

  <g transform="translate(120 192)">
    <rect width="256" height="256" rx="58" fill="url(#tile)"/>
    <rect x="1.5" y="1.5" width="253" height="253" rx="56.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="3"/>
    <line x1="160" y1="160" x2="200" y2="200" stroke="url(#aro)" stroke-width="24" stroke-linecap="round"/>
    <circle cx="112" cy="112" r="53" fill="url(#cristal)"/>
    <g clip-path="url(#lente)">
      <g stroke="#67E8F9" stroke-opacity="0.08" stroke-width="1.5">
        <line x1="50" y1="72" x2="174" y2="72"/><line x1="50" y1="88" x2="174" y2="88"/>
        <line x1="50" y1="104" x2="174" y2="104"/><line x1="50" y1="120" x2="174" y2="120"/>
        <line x1="50" y1="136" x2="174" y2="136"/><line x1="50" y1="152" x2="174" y2="152"/>
      </g>
      <g stroke="#A5B4FC" stroke-opacity="0.6" stroke-width="2.5" stroke-linecap="round">
        <line x1="84" y1="100" x2="114" y2="78"/><line x1="84" y1="100" x2="96" y2="136"/>
        <line x1="114" y1="78" x2="138" y2="116"/><line x1="96" y1="136" x2="138" y2="116"/>
        <line x1="96" y1="136" x2="126" y2="148"/><line x1="138" y1="116" x2="126" y2="148"/>
      </g>
      <circle cx="84" cy="100" r="6" fill="#CBD5E1"/>
      <circle cx="114" cy="78" r="6" fill="#FBBF24"/>
      <circle cx="96" cy="136" r="6" fill="#CBD5E1"/>
      <circle cx="126" cy="148" r="5.5" fill="#60A5FA"/>
      <circle cx="138" cy="116" r="14" fill="#F43F5E" fill-opacity="0.28"/>
      <circle cx="138" cy="116" r="7.5" fill="#F43F5E"/>
    </g>
    <circle cx="112" cy="112" r="60" fill="none" stroke="url(#aro)" stroke-width="14"/>
    <path d="M74 88 A44 44 0 0 1 100 69" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="5" stroke-linecap="round"/>
  </g>

  <text x="444" y="240" class="sans" font-size="18" font-weight="600" letter-spacing="4" fill="#67E8F9">PLUGIN DE CLAUDE CODE</text>
  <text x="436" y="352" class="sans" font-size="132" font-weight="800" letter-spacing="-3" fill="url(#titulo)">Lupa</text>
  <text x="444" y="410" class="sans" font-size="34" fill="#CBD5E1">La auditoría de seguridad de un proyecto entero</text>

  <g class="sans" font-size="20" text-anchor="middle" fill="#A5F3FC">
    <rect x="444" y="440" width="96" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.06" stroke="#67E8F9" stroke-opacity="0.35"/>
    <text x="492" y="466">código</text>
    <rect x="550" y="440" width="86" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.06" stroke="#67E8F9" stroke-opacity="0.35"/>
    <text x="593" y="466">CI/CD</text>
    <rect x="646" y="440" width="134" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.06" stroke="#67E8F9" stroke-opacity="0.35"/>
    <text x="713" y="466">servidores</text>
    <rect x="790" y="440" width="66" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.06" stroke="#67E8F9" stroke-opacity="0.35"/>
    <text x="823" y="466">red</text>
    <rect x="866" y="440" width="114" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.06" stroke="#67E8F9" stroke-opacity="0.35"/>
    <text x="923" y="466">internet</text>
  </g>
  <text x="1000" y="466" class="sans" font-size="20" font-weight="600" fill="#E2E8F0">→  un solo informe</text>

  <text x="120" y="584" class="mono" font-size="20" fill="#94A3B8">github.com/eloy-leadtech/lupa</text>
</svg>
