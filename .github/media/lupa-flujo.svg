<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 540" width="1280" height="540" role="img" aria-label="Cinco frentes (código, CI/CD, servidores, red e internet) entran en Lupa, que los pasa por gitleaks, Semgrep, Trivy y zizmor más la revisión de Claude, y sale un solo informe HTML para el equipo de seguridad">
  <style>
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, 'Cascadia Code', SFMono-Regular, Menlo, Consolas, monospace; }
    @keyframes flujo { to { stroke-dashoffset: -20; } }
    .flujo { stroke-dasharray: 3 7; animation: flujo 1.1s linear infinite; }
    @media (prefers-reduced-motion: reduce) { .flujo { animation: none; } }
  </style>
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070C1A"/>
      <stop offset="0.6" stop-color="#11122F"/>
      <stop offset="1" stop-color="#1E1B52"/>
    </linearGradient>
    <pattern id="puntos" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1.3" fill="#94A3B8" fill-opacity="0.13"/>
    </pattern>
    <radialGradient id="resplandor" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1020"/>
      <stop offset="1" stop-color="#2B2876"/>
    </linearGradient>
    <linearGradient id="aro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <radialGradient id="cristal" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#67E8F9" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#67E8F9" stop-opacity="0.03"/>
    </radialGradient>
    <linearGradient id="salida" gradientUnits="userSpaceOnUse" x1="792" y1="0" x2="852" y2="0">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <clipPath id="lente"><circle cx="112" cy="112" r="53"/></clipPath>
    <clipPath id="tarjeta"><rect width="1280" height="540" rx="28"/></clipPath>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <marker id="punta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#818CF8"/>
    </marker>
  </defs>

  <g clip-path="url(#tarjeta)">
    <rect width="1280" height="540" fill="url(#fondo)"/>
    <rect width="1280" height="540" fill="url(#puntos)"/>
    <circle cx="692" cy="272" r="230" fill="url(#resplandor)"/>

    <!-- conectores de cada frente a la lupa -->
    <g fill="none" stroke-width="2.4" stroke-opacity="0.75">
      <path class="flujo" d="M460 80 C530 80 530 272 600 272" stroke="#22D3EE"/>
      <path class="flujo" d="M460 176 C530 176 530 272 600 272" stroke="#A78BFA"/>
      <path class="flujo" d="M460 272 L600 272" stroke="#34D399"/>
      <path class="flujo" d="M460 368 C530 368 530 272 600 272" stroke="#FBBF24"/>
      <path class="flujo" d="M460 464 C530 464 530 272 600 272" stroke="#F472B6"/>
    </g>

    <!-- los cinco frentes -->
    <g class="sans">
      <g transform="translate(48 40)">
        <rect width="412" height="80" rx="16" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.1"/>
        <circle cx="44" cy="40" r="26" fill="#22D3EE" fill-opacity="0.14" stroke="#22D3EE" stroke-opacity="0.5"/>
        <text x="44" y="46" class="mono" font-size="17" font-weight="700" fill="#22D3EE" text-anchor="middle">&lt;/&gt;</text>
        <text x="88" y="34" font-size="22" font-weight="700" fill="#FFFFFF">Código</text>
        <text x="88" y="60" font-size="16" fill="#94A3B8">secretos, fallos, CVE y endpoints</text>
        <circle cx="412" cy="40" r="4" fill="#22D3EE"/>
      </g>
      <g transform="translate(48 136)">
        <rect width="412" height="80" rx="16" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.1"/>
        <circle cx="44" cy="40" r="26" fill="#A78BFA" fill-opacity="0.14" stroke="#A78BFA" stroke-opacity="0.5"/>
        <g transform="translate(44 40)" fill="none" stroke="#A78BFA" stroke-width="2.2" stroke-linecap="round">
          <circle cx="-7" cy="-10" r="3.5"/><circle cx="-7" cy="10" r="3.5"/><circle cx="8" cy="-4" r="3.5"/>
          <path d="M-7 -6.5 V6.5 M8 -0.5 C8 5 -1 4 -5 7.5"/>
        </g>
        <text x="88" y="34" font-size="22" font-weight="700" fill="#FFFFFF">CI/CD</text>
        <text x="88" y="60" font-size="16" fill="#94A3B8">ramas, pipelines, logs y OIDC</text>
        <circle cx="412" cy="40" r="4" fill="#A78BFA"/>
      </g>
      <g transform="translate(48 232)">
        <rect width="412" height="80" rx="16" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.1"/>
        <circle cx="44" cy="40" r="26" fill="#34D399" fill-opacity="0.14" stroke="#34D399" stroke-opacity="0.5"/>
        <g transform="translate(44 40)" stroke="#34D399" stroke-width="2.2">
          <rect x="-11" y="-11" width="22" height="9" rx="2" fill="none"/>
          <rect x="-11" y="2" width="22" height="9" rx="2" fill="none"/>
          <circle cx="5.5" cy="-6.5" r="1.4" fill="#34D399" stroke="none"/>
          <circle cx="5.5" cy="6.5" r="1.4" fill="#34D399" stroke="none"/>
        </g>
        <text x="88" y="34" font-size="22" font-weight="700" fill="#FFFFFF">Servidores</text>
        <text x="88" y="60" font-size="16" fill="#94A3B8">cada uno por dentro, en solo lectura</text>
        <circle cx="412" cy="40" r="4" fill="#34D399"/>
      </g>
      <g transform="translate(48 328)">
        <rect width="412" height="80" rx="16" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.1"/>
        <circle cx="44" cy="40" r="26" fill="#FBBF24" fill-opacity="0.14" stroke="#FBBF24" stroke-opacity="0.5"/>
        <g transform="translate(44 40)">
          <g stroke="#FBBF24" stroke-width="2"><line x1="-9" y1="7" x2="9" y2="7"/><line x1="-9" y1="7" x2="0" y2="-9"/><line x1="9" y1="7" x2="0" y2="-9"/></g>
          <g fill="#FBBF24"><circle cx="-9" cy="7" r="3.8"/><circle cx="9" cy="7" r="3.8"/><circle cx="0" cy="-9" r="3.8"/></g>
        </g>
        <text x="88" y="34" font-size="22" font-weight="700" fill="#FFFFFF">Red</text>
        <text x="88" y="60" font-size="16" fill="#94A3B8">quién habla con quién, y cómo</text>
        <circle cx="412" cy="40" r="4" fill="#FBBF24"/>
      </g>
      <g transform="translate(48 424)">
        <rect width="412" height="80" rx="16" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.1"/>
        <circle cx="44" cy="40" r="26" fill="#F472B6" fill-opacity="0.14" stroke="#F472B6" stroke-opacity="0.5"/>
        <g transform="translate(44 40)" fill="none" stroke="#F472B6" stroke-width="2.2">
          <circle r="11"/><ellipse rx="5" ry="11"/><line x1="-11" y1="0" x2="11" y2="0"/>
        </g>
        <text x="88" y="34" font-size="22" font-weight="700" fill="#FFFFFF">Internet</text>
        <text x="88" y="60" font-size="16" fill="#94A3B8">lo que ve cualquiera desde fuera</text>
        <circle cx="412" cy="40" r="4" fill="#F472B6"/>
      </g>
    </g>

    <!-- la lupa -->
    <g transform="translate(604 184) scale(0.6875)">
      <rect width="256" height="256" rx="58" fill="url(#tile)"/>
      <rect x="1.5" y="1.5" width="253" height="253" rx="56.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="3"/>
      <line x1="160" y1="160" x2="200" y2="200" stroke="url(#aro)" stroke-width="24" stroke-linecap="round"/>
      <circle cx="112" cy="112" r="53" fill="url(#cristal)"/>
      <g clip-path="url(#lente)">
        <g stroke="#A5B4FC" stroke-opacity="0.6" stroke-width="2.5" stroke-linecap="round">
          <line x1="84" y1="100" x2="114" y2="78"/><line x1="84" y1="100" x2="96" y2="136"/>
          <line x1="114" y1="78" x2="138" y2="116"/><line x1="96" y1="136" x2="138" y2="116"/>
          <line x1="96" y1="136" x2="126" y2="148"/><line x1="138" y1="116" x2="126" y2="148"/>
        </g>
        <circle cx="84" cy="100" r="6" fill="#CBD5E1"/>
        <circle cx="114" cy="78" r="6" fill="#FBBF24"/>
        <circle cx="96" cy="136" r="6" fill="#CBD5E1"/>
        <circle cx="126" cy="148" r="5.5" fill="#60A5FA"/>
        <circle cx="138" cy="116" r="14" fill="#F43F5E" fill-opacity="0.28"/>
        <circle cx="138" cy="116" r="7.5" fill="#F43F5E"/>
      </g>
      <circle cx="112" cy="112" r="60" fill="none" stroke="url(#aro)" stroke-width="14"/>
      <path d="M74 88 A44 44 0 0 1 100 69" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="5" stroke-linecap="round"/>
    </g>
    <text x="692" y="400" class="sans" font-size="15" fill="#CBD5E1" text-anchor="middle">gitleaks · Semgrep · Trivy · zizmor</text>
    <text x="692" y="424" class="sans" font-size="15" font-weight="600" fill="#67E8F9" text-anchor="middle">+ la revisión de Claude</text>

    <!-- salida -->
    <line x1="792" y1="272" x2="852" y2="272" stroke="url(#salida)" stroke-width="3" marker-end="url(#punta)"/>

    <!-- el informe -->
    <text x="864" y="72" class="mono" font-size="14" fill="#94A3B8">lupa-equipo-proyecto-fecha.html</text>
    <g filter="url(#sombra)">
      <rect x="864" y="88" width="368" height="376" rx="16" fill="#F8FAFC"/>
    </g>
    <g class="sans">
      <rect x="880" y="102" width="88" height="28" rx="14" fill="#1E1B4B"/>
      <text x="924" y="121" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Informe</text>
      <text x="984" y="121" font-size="14" fill="#64748B">Mapa del código</text>
      <line x1="880" y1="144" x2="1216" y2="144" stroke="#E2E8F0"/>

      <circle cx="922" cy="196" r="38" fill="#F59E0B"/>
      <text x="922" y="213" font-size="46" font-weight="800" fill="#FFFFFF" text-anchor="middle">C</text>
      <text x="978" y="190" font-size="19" font-weight="700" fill="#0F172A">Nota de la A a la F</text>
      <text x="978" y="214" font-size="14" fill="#64748B">con la fórmula explicada</text>

      <rect x="880" y="250" width="78" height="26" rx="13" fill="#FEE2E2"/>
      <text x="919" y="268" font-size="13" font-weight="600" fill="#B91C1C" text-anchor="middle">3 graves</text>
      <rect x="966" y="250" width="92" height="26" rx="13" fill="#FEF3C7"/>
      <text x="1012" y="268" font-size="13" font-weight="600" fill="#B45309" text-anchor="middle">11 a mirar</text>
      <rect x="1066" y="250" width="100" height="26" rx="13" fill="#DBEAFE"/>
      <text x="1116" y="268" font-size="13" font-weight="600" fill="#1D4ED8" text-anchor="middle">24 menores</text>

      <text x="880" y="308" font-size="12" font-weight="700" letter-spacing="1.5" fill="#334155">LO URGENTE</text>
      <rect x="880" y="320" width="336" height="26" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
      <rect x="880" y="320" width="6" height="26" rx="3" fill="#EF4444"/>
      <rect x="898" y="329" width="210" height="8" rx="4" fill="#CBD5E1"/>
      <rect x="880" y="354" width="336" height="26" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
      <rect x="880" y="354" width="6" height="26" rx="3" fill="#EF4444"/>
      <rect x="898" y="363" width="170" height="8" rx="4" fill="#CBD5E1"/>
      <rect x="880" y="388" width="336" height="26" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
      <rect x="880" y="388" width="6" height="26" rx="3" fill="#F59E0B"/>
      <rect x="898" y="397" width="236" height="8" rx="4" fill="#CBD5E1"/>

      <line x1="896" y1="440" x2="1200" y2="440" stroke="#CBD5E1" stroke-width="2"/>
      <circle cx="896" cy="440" r="7" fill="#F59E0B"/>
      <circle cx="972" cy="440" r="7" fill="#EF4444"/>
      <circle cx="1048" cy="440" r="7" fill="#22C55E"/>
      <circle cx="1124" cy="440" r="7" fill="#22C55E"/>
      <circle cx="1200" cy="440" r="7" fill="#F59E0B"/>
    </g>
    <text x="1048" y="506" class="sans" font-size="16" fill="#CBD5E1" text-anchor="middle">→ al equipo de seguridad, por Teams o correo</text>
  </g>
</svg>
